name: Deploy to App Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: bible-research-489314
  GCP_REGION: europe-west3
  WIF_PROVIDER: projects/670506724494/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-deployer@bible-research-489314.iam.gserviceaccount.com
  AUDIO_JOB_NAME: audio-generator
  AUDIO_IMAGE_REPO: audio-generator
  AUDIO_IMAGE_NAME: audio-generator

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Run database migrations
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GAE_APPLICATION: s~${{ env.GCP_PROJECT_ID }}
        run: python manage.py migrate --noinput

      - name: Deploy to App Engine
        run: |
          gcloud app deploy app.yaml \
            --project="${GCP_PROJECT_ID}" \
            --quiet --promote --stop-previous-version

      - name: Cleanup old App Engine versions
        run: |
          chmod +x scripts/cleanup_app_engine_versions.sh
          ./scripts/cleanup_app_engine_versions.sh \
            "${GCP_PROJECT_ID}" "default"

      - name: Recent serving versions
        run: |
          gcloud app versions list \
            --project="${GCP_PROJECT_ID}" \
            --hide-no-traffic \
            --sort-by=~last_deployed_time \
            --limit=5

      # Build a dedicated container image for the audio-generator
      # Cloud Run Job, push it to the ``audio-generator`` Artifact
      # Registry repo under a deterministic ``:<git-sha>`` tag, then
      # pin the Cloud Run Job to the freshly pushed immutable digest.
      # Terraform ignores changes to the Job image (see
      # audio_generator.tf lifecycle block), so this step is the sole
      # writer of the field. We no longer piggyback on App Engine's
      # auto-generated gae-standard image (whose path Terraform cannot
      # predict, which previously forced an unusable ``:latest`` tag).
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push audio-generator image
        id: audio_image
        run: |
          set -euo pipefail

          IMAGE_BASE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AUDIO_IMAGE_REPO}/${AUDIO_IMAGE_NAME}"
          IMAGE_TAGGED="${IMAGE_BASE}:${GITHUB_SHA}"
          echo "Building ${IMAGE_TAGGED}"

          docker build -t "${IMAGE_TAGGED}" .
          docker push "${IMAGE_TAGGED}"

          # Resolve the just-pushed tag to its immutable digest so the
          # scheduled monthly job always runs the exact image that
          # shipped, even after subsequent deploys overwrite tags.
          DIGEST=$(gcloud artifacts docker images describe \
            "${IMAGE_TAGGED}" \
            --project="${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')
          IMMUTABLE="${IMAGE_BASE}@${DIGEST}"
          echo "Immutable image ref: ${IMMUTABLE}"
          echo "immutable_image=${IMMUTABLE}" >> "${GITHUB_OUTPUT}"

      - name: Sync audio-generator Cloud Run Job image
        run: |
          set -euo pipefail
          gcloud run jobs update "${AUDIO_JOB_NAME}" \
            --image="${{ steps.audio_image.outputs.immutable_image }}" \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT_ID}"
